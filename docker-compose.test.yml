services:
  bot:
    build: .
    container_name: filepress-bot-test
    env_file: .env.test
    environment:
      DATABASE_PATH: /app/data/test-uploads.sqlite3
      DOWNLOAD_DIR: /app/downloads
      GDRIVE_SERVICE_ACCOUNT_FILE: /app/service-account.json
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./service-account.json:/app/service-account.json:ro
      - test-data:/app/data
      - test-downloads:/app/downloads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if b'filepress-telegram-bot' in urllib.request.urlopen('http://localhost:8080/health', timeout=3).read() else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: "no"

volumes:
  test-data:
  test-downloads:
